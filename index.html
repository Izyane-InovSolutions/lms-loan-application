<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B4F72" />
    <meta
      name="description"
      content="Apply online for a personal or business loan in Zambia. Save your progress as you go and finish on any device."
    />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Loan Application — Loan Origination</title>
    <script>
      // A newer build than this browser last ran: forget what it saved for display (the theme and
      // branding caches, view and board layouts) so the new version shows as built, with no need to
      // clear the browser. Kept: unfinished application drafts, the referral link, dark mode.
      // __APP_BUILD__ is stamped in by vite.config.js (a new value per build, and per dev-server start).
      try {
        var build = '__APP_BUILD__'
        if (localStorage.getItem('los:build') !== build) {
          ;['los:theme-css', 'los:theme-font', 'los:branding', 'los:workflow-view'].forEach(function (key) {
            localStorage.removeItem(key)
          })
          for (var i = localStorage.length - 1; i >= 0; i--) {
            var key = localStorage.key(i)
            if (key && key.indexOf('los:pipeline:') === 0) localStorage.removeItem(key)
          }
          localStorage.setItem('los:build', build)
        }
      } catch (error) {}
      // The workspace theme saved by the last visit (src/lib/applyTheme.js), applied before
      // anything is drawn so the default colours never flash up first.
      try {
        var css = localStorage.getItem('los:theme-css')
        if (css) {
          var style = document.createElement('style')
          style.id = 'los-theme'
          style.textContent = css
          document.head.appendChild(style)
        }
        var font = localStorage.getItem('los:theme-font')
        if (font) {
          var link = document.createElement('link')
          link.id = 'los-theme-font'
          link.rel = 'stylesheet'
          link.href = font
          document.head.appendChild(link)
        }
      } catch (error) {}
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
