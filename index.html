<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B4F72" />
    <meta
      name="description"
      content="Apply online for a personal or business loan in Zambia. Save your progress as you go and finish on any device."
    />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Loan Application — Loan Origination</title>
    <script>
      // The workspace theme saved by the last visit (src/lib/applyTheme.js), applied before
      // anything is drawn so the default colours never flash up first.
      try {
        var css = localStorage.getItem('los:theme-css')
        if (css) {
          var style = document.createElement('style')
          style.id = 'los-theme'
          style.textContent = css
          document.head.appendChild(style)
        }
        var font = localStorage.getItem('los:theme-font')
        if (font) {
          var link = document.createElement('link')
          link.id = 'los-theme-font'
          link.rel = 'stylesheet'
          link.href = font
          document.head.appendChild(link)
        }
      } catch (error) {}
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
