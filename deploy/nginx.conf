# Replace loans.example.com, then run certbot to add HTTPS.
server {
    server_name loans.example.com;
    root /opt/los/app/dist;
    client_max_body_size 6m;               # uploads are capped at 4 MB by the app

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;           # AI routes allow up to 120 s
    }
    # Only the local cron job may call the maintenance endpoint.
    location = /api/cron/purge-expired-drafts { return 404; }

    # Never serve stored documents directly.
    location /local-blob/ { return 404; }

    location / { try_files $uri /index.html; }
}
